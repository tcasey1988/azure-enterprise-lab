name: PowerShell Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation modules
        shell: pwsh
        run: |
          Install-Module `
            -Name Pester `
            -MinimumVersion 5.5.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

          Install-Module `
            -Name PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $Results = Invoke-ScriptAnalyzer `
            -Path ./scripts `
            -Recurse `
            -Severity Warning, Error

          if ($Results) {
              $Results | Format-Table -Wrap
              throw "PSScriptAnalyzer found problems."
          }

      - name: Run Pester
        shell: pwsh
        run: |
          $Results = Invoke-Pester `
            -Path ./tests `
            -PassThru

          if ($Results.FailedCount -gt 0) {
              throw "$($Results.FailedCount) test(s) failed."
          }